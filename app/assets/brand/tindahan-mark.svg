<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tindahan">
  <!-- Periwinkle rounded-square base. Keep in sync with tindahan-mark-maskable.svg
       (same content group, full-bleed background, scaled to the maskable safe zone)
       and with the brand-600 token / nuxt.config.ts theme_color (#6d5de0). -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#6d5de0" />

  <g id="storefront">
    <!-- Soft ground shadow under the storefront. -->
    <rect x="18" y="79" width="64" height="3" rx="1.5" fill="#332874" opacity="0.25" />

    <!-- Building facade -->
    <rect x="20" y="46" width="60" height="32" rx="3" fill="#faf8f3" />

    <!-- Awning: cream base clipped to a rounded rect, coral stripes on top,
         scalloped valance along the bottom edge. -->
    <clipPath id="awning-clip">
      <rect x="16" y="28" width="68" height="18" rx="3" />
    </clipPath>
    <g clip-path="url(#awning-clip)">
      <rect x="16" y="28" width="68" height="18" fill="#faf8f3" />
      <rect x="16" y="28" width="13.6" height="18" fill="#e8736c" />
      <rect x="43.2" y="28" width="13.6" height="18" fill="#e8736c" />
      <rect x="70.4" y="28" width="13.6" height="18" fill="#e8736c" />
    </g>
    <circle cx="22.8" cy="46" r="3.4" fill="#e8736c" />
    <circle cx="36.4" cy="46" r="3.4" fill="#faf8f3" />
    <circle cx="50" cy="46" r="3.4" fill="#e8736c" />
    <circle cx="63.6" cy="46" r="3.4" fill="#faf8f3" />
    <circle cx="77.2" cy="46" r="3.4" fill="#e8736c" />

    <!-- Door -->
    <rect x="25" y="57" width="15" height="21" rx="2" fill="#0d8a76" />
    <circle cx="37" cy="68" r="1.3" fill="#faf8f3" />

    <!-- Window with a shelf accent (decorative brand-mark detail only - not a
         product image; the app UI itself renders no product pictures). -->
    <rect x="50" y="57" width="24" height="14" rx="2" fill="#ffffff" />
    <rect x="52" y="63.5" width="20" height="1.4" rx="0.7" fill="#d8d1fa" />
    <rect x="53" y="65" width="7" height="5" rx="1" fill="#f59e0b" />
    <rect x="62" y="65" width="8" height="5" rx="1" fill="#e8736c" />
  </g>
</svg>
